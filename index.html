<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Challenge - Product Preview Card Component Main</title>
    <link
      rel="shortcut icon"
      href="./src/images/favicon-32x32.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="perfum-image">
          <picture>
            <source
              media="(max-width: 376px)"
              srcset="./src/images/image-product-mobile.jpg"
            />
            <img
              src="./src/images/image-product-desktop.jpg"
              alt="Perfum Image"
            />
          </picture>
        </div>

        <div class="perfum-info">
          <h3 class="title-info">PERFUME</h3>

          <h1>Gabrielle Essence Eau De Parfum</h1>

          <p class="text-info">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>

          <div class="perfum-price">
            <p class="descont-price">$149.99</p>
            <p class="real-price">$169.99</p>
          </div>

          <button><img src="./src/images/icon-cart.svg" alt="icon cart"> Add to Cart</button>
        </div>
      </section>
    </main>
  </body>
</html>
